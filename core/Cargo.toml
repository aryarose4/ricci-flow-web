[package]
name = "ricci_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
npyz = { version = "0.9", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
miniz_oxide = "0.9.1"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true

